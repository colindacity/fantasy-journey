<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 1: Interactive Flowchart | Fantasy Reading Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/styles/theme.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <a href="../../index.html" class="back-btn">← Back to Concepts</a>
        <h1 class="app-title">Interactive Flowchart Journey</h1>
        <button class="reset-btn" id="resetBtn">🔄 Start Over</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Progress Tracker -->
      <aside class="progress-sidebar">
        <h3>Your Journey</h3>
        <div class="progress-books" id="progressBooks">
          <p class="progress-empty">Start your journey with The Hobbit!</p>
        </div>
        <div class="ornament"></div>
        <div class="progress-stats">
          <div class="stat">
            <span class="stat-value" id="booksRead">0</span>
            <span class="stat-label">Books Explored</span>
          </div>
        </div>
      </aside>

      <!-- Book Display -->
      <section class="book-display" id="bookDisplay">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <p>Loading your fantasy journey...</p>
        </div>
      </section>
    </main>

    <!-- Result Modal -->
    <div class="modal" id="resultModal">
      <div class="modal-content">
        <h2 id="resultTitle"></h2>
        <div class="ornament"></div>
        <p id="resultDescription"></p>
        <div class="daniel-quote" id="resultQuote"></div>
        <div id="resultRecommendations"></div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="restartBtn">Start New Journey</button>
          <button class="btn btn-secondary" id="closeModalBtn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
