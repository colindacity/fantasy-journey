name: Deploy All Apps to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/redesign-youtube-clone-011CUP5xmZw5CYhippuyQtLw
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version info
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="v1.${COMMIT_COUNT}-${SHORT_SHA}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "commit_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT

          echo "📦 Building version: ${VERSION}"
          echo "📅 Build date: ${BUILD_DATE}"

      - name: Create deployment directory
        run: |
          mkdir -p _site
          echo "📁 Created deployment directory"

      - name: Copy root files
        run: |
          if [ -f index.html ]; then
            cp index.html _site/
            echo "✅ Copied root index.html"
          fi
          if [ -f README.md ]; then
            cp README.md _site/
          fi
          if [ -d shared ]; then
            cp -r shared _site/
          fi

      - name: Build RPG Game
        run: |
          echo "🎮 Building RPG Game..."
          if [ -d rpg-game ]; then
            cp -r rpg-game _site/rpg-game
            cat > _site/rpg-game/version.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "buildDate": "${{ steps.version.outputs.build_date }}",
            "commitSha": "${{ steps.version.outputs.commit_sha }}",
            "buildNumber": "${{ github.run_number }}",
            "app": "RPG Game"
          }
          EOF
            echo "✅ RPG Game built"
          fi

      - name: Build Fantasy Reading Guide
        run: |
          echo "📚 Building Fantasy Reading Guide..."
          if [ -d fantasy-reading-guide ]; then
            cp -r fantasy-reading-guide _site/fantasy-reading-guide

            VERSION="${{ steps.version.outputs.version }}"
            BUILD_DATE="${{ steps.version.outputs.build_date }}"

            cat > _site/fantasy-reading-guide/version.json << EOF
          {
            "version": "${VERSION}",
            "buildDate": "${BUILD_DATE}",
            "commitSha": "${{ steps.version.outputs.commit_sha }}",
            "buildNumber": "${{ github.run_number }}",
            "repository": "${{ github.repository }}",
            "deployer": "GitHub Actions",
            "app": "Fantasy Reading Guide"
          }
          EOF

            sed -i "s|</head>|    <meta name=\"app-version\" content=\"${VERSION}\">\n    <meta name=\"build-date\" content=\"${BUILD_DATE}\">\n</head>|" _site/fantasy-reading-guide/index.html

            sed -i "s|js/data.js|js/data.js?v=${VERSION}|g" _site/fantasy-reading-guide/index.html
            sed -i "s|js/map.js|js/map.js?v=${VERSION}|g" _site/fantasy-reading-guide/index.html
            sed -i "s|js/main.js|js/main.js?v=${VERSION}|g" _site/fantasy-reading-guide/index.html
            sed -i "s|css/styles.css|css/styles.css?v=${VERSION}|g" _site/fantasy-reading-guide/index.html

            echo "✅ Fantasy Reading Guide built"
          fi

      - name: Create apps index page
        run: |
          cat > _site/apps-index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Fantasy Journey - Apps</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      padding: 2rem;
                  }
                  .container { max-width: 1200px; width: 100%; }
                  h1 {
                      color: white;
                      text-align: center;
                      font-size: clamp(2rem, 5vw, 3rem);
                      margin-bottom: 3rem;
                      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
                  }
                  .apps-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 2rem;
                  }
                  .app-card {
                      background: white;
                      border-radius: 20px;
                      padding: 2rem;
                      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                      transition: transform 0.3s ease;
                      text-decoration: none;
                      color: inherit;
                      display: block;
                  }
                  .app-card:hover { transform: translateY(-10px); }
                  .app-icon { font-size: 4rem; margin-bottom: 1rem; }
                  .app-title {
                      font-size: 1.8rem;
                      color: #667eea;
                      margin-bottom: 1rem;
                  }
                  .app-description {
                      color: #666;
                      line-height: 1.6;
                      margin-bottom: 1.5rem;
                  }
                  .app-link {
                      display: inline-block;
                      padding: 0.75rem 1.5rem;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      border-radius: 50px;
                      text-decoration: none;
                      font-weight: bold;
                  }
                  .version-info {
                      text-align: center;
                      color: white;
                      margin-top: 3rem;
                      opacity: 0.9;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🎮 Fantasy Journey Apps</h1>
                  <div class="apps-grid">
                      <a href="fantasy-reading-guide/" class="app-card">
                          <div class="app-icon">📚</div>
                          <h2 class="app-title">Fantasy Reading Guide</h2>
                          <p class="app-description">
                              Interactive map to discover your perfect fantasy subgenre.
                              Explore 50+ books with beautiful visualizations.
                          </p>
                          <span class="app-link">Explore Guide →</span>
                      </a>
                      <a href="rpg-game/" class="app-card">
                          <div class="app-icon">⚔️</div>
                          <h2 class="app-title">RPG Adventure Game</h2>
                          <p class="app-description">
                              Embark on an epic text-based RPG adventure.
                              Battle monsters and explore dungeons!
                          </p>
                          <span class="app-link">Start Adventure →</span>
                      </a>
                  </div>
                  <div class="version-info" id="version-info">Fantasy Journey Apps</div>
              </div>
              <script>
              fetch('version.json')
                  .then(r => r.json())
                  .then(d => {
                      document.getElementById('version-info').textContent =
                          'Version ' + d.version + ' | Build #' + d.buildNumber;
                  })
                  .catch(() => {});
              </script>
          </body>
          </html>
          HTMLEOF
          echo "✅ Created apps index"

      - name: Create global version file
        run: |
          cat > _site/version.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "buildDate": "${{ steps.version.outputs.build_date }}",
            "commitSha": "${{ steps.version.outputs.commit_sha }}",
            "buildNumber": "${{ github.run_number }}",
            "repository": "${{ github.repository }}",
            "deployer": "GitHub Actions",
            "apps": ["fantasy-reading-guide", "rpg-game"]
          }
          EOF

      - name: Display build summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 Build Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Build #: ${{ github.run_number }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Apps: fantasy-reading-guide, rpg-game"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    # Deploy from main branch or the active feature branch
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/redesign-youtube-clone-011CUP5xmZw5CYhippuyQtLw'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display deployment info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment Successful!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐 Main: ${{ steps.deployment.outputs.page_url }}"
          echo "📚 Fantasy Guide: ${{ steps.deployment.outputs.page_url }}fantasy-reading-guide/"
          echo "⚔️ RPG Game: ${{ steps.deployment.outputs.page_url }}rpg-game/"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Create summary
        run: |
          echo "## 🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live URLs" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 [Apps Index](${{ steps.deployment.outputs.page_url }}apps-index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- 📚 [Fantasy Reading Guide](${{ steps.deployment.outputs.page_url }}fantasy-reading-guide/)" >> $GITHUB_STEP_SUMMARY
          echo "- ⚔️ [RPG Game](${{ steps.deployment.outputs.page_url }}rpg-game/)" >> $GITHUB_STEP_SUMMARY
