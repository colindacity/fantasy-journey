<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Fantasy Reading Quest - Discover Your Next Great Fantasy Book</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #87ceeb 0%, #ffdab9 100%);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4/3;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      border-radius: 24px;
      overflow: hidden;
      background: #87ceeb;
    }

    /* ============= LOADING SCREEN ============= */
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    #loading.hidden {
      display: none;
    }

    .loading-logo {
      font-size: 96px;
      margin-bottom: 30px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-30px); }
    }

    .loading-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 15px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      letter-spacing: -1px;
    }

    .loading-subtitle {
      font-size: 18px;
      color: #e0e7ff;
      margin-bottom: 50px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .loading-bar-container {
      width: 320px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    #loadingFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      border-radius: 10px;
      transition: width 0.3s ease;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
    }

    #loadingText {
      color: #fef3c7;
      font-size: 15px;
      font-weight: 500;
    }

    /* ============= MODERN MINIMALIST UI ============= */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar - Minimalist Design */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    #locationLabel {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      color: #1f2937;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bookshelf-counter {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      padding: 10px 20px;
      border-radius: 100px;
      box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
    }

    .bookshelf-counter .icon {
      font-size: 24px;
    }

    #bookCount {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      min-width: 30px;
      text-align: center;
    }

    /* Bottom Instructions - Minimal */
    .instructions {
      margin-top: auto;
      padding: 20px;
      background: linear-gradient(0deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
    }

    .instructions p {
      color: #1f2937;
      font-size: 15px;
      margin: 6px 0;
      font-weight: 500;
    }

    .key-hint {
      display: inline-block;
      background: rgba(139, 92, 246, 0.1);
      color: #8b5cf6;
      padding: 5px 12px;
      border-radius: 8px;
      margin: 0 4px;
      font-weight: 700;
      border: 2px solid rgba(139, 92, 246, 0.2);
    }

    /* ============= MOBILE CONTROLS - MINIMALIST ============= */
    #mobile-controls {
      position: fixed;
      bottom: 40px;
      left: 40px;
      width: 110px;
      height: 110px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 2000;
    }

    #mobile-controls.show {
      opacity: 1;
      pointer-events: all;
    }

    #joystick {
      position: absolute;
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 100%);
      border: 3px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    #joystick-knob {
      position: absolute;
      width: 45px;
      height: 45px;
      background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
      border: 3px solid rgba(139, 92, 246, 0.4);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s ease-out;
    }

    #actionButton {
      position: fixed;
      bottom: 70px;
      right: 40px;
      width: 75px;
      height: 75px;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      border: 4px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.1s ease;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
      z-index: 2000;
      user-select: none;
      -webkit-user-select: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #actionButton.show {
      opacity: 1;
      pointer-events: all;
    }

    #actionButton:active {
      transform: scale(0.9);
    }

    /* ============= RESPONSIVE DESIGN ============= */
    @media (max-width: 768px) {
      #game-container {
        width: 100vw;
        height: 100vh;
        max-width: none;
        border-radius: 0;
      }

      .loading-title {
        font-size: 36px;
      }

      .loading-subtitle {
        font-size: 16px;
      }

      .loading-bar-container {
        width: 280px;
      }

      #locationLabel {
        font-size: 16px;
      }

      .bookshelf-counter {
        padding: 8px 16px;
      }

      .bookshelf-counter .icon {
        font-size: 20px;
      }

      #bookCount {
        font-size: 18px;
      }

      .instructions {
        display: none;
      }
    }

    @media (min-width: 769px) {
      #mobile-controls,
      #actionButton {
        display: none !important;
      }
    }

    /* Performance optimizations */
    #game-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="loading-logo">📚</div>
    <div class="loading-title">FANTASY READING QUEST</div>
    <div class="loading-subtitle">Monument Valley Edition</div>
    <div class="loading-bar-container">
      <div id="loadingFill"></div>
    </div>
    <div id="loadingText">Loading your fantasy journey...</div>
  </div>

  <!-- Game Container -->
  <div id="game-container">
    <!-- UI Overlay -->
    <div id="ui-overlay">
      <!-- Top Bar -->
      <div class="top-bar">
        <div id="locationLabel">
          <span>📚</span>
          <span>Fantasy Reading Quest</span>
        </div>
        <div class="bookshelf-counter">
          <span class="icon">📖</span>
          <span id="bookCount">0</span>
        </div>
      </div>

      <!-- Bottom Instructions (Desktop only) -->
      <div class="instructions">
        <p>
          <span class="key-hint">WASD</span> or <span class="key-hint">Arrow Keys</span> to move
        </p>
        <p style="font-size: 13px; color: #6b7280; margin-top: 4px;">
          Walk close to books to collect them • Click on monuments to explore zones
        </p>
      </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
      <div id="joystick">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <div id="actionButton">⚡</div>
  </div>

  <!-- Phaser 3 Game Engine -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Game Scripts with Auto Cache-Busting -->
  <script>
    // Auto cache-buster using current timestamp
    const cacheBuster = Date.now();
    const script = document.createElement('script');
    script.src = 'game-v3.js?v=' + cacheBuster;
    script.onerror = function() {
      console.error('Failed to load game script');
      document.getElementById('loadingText').textContent = 'Error loading game. Please refresh.';
      document.getElementById('loadingText').style.color = '#ef4444';
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
